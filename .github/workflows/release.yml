name: Release artifact

# On every push to main: run the full CI, then build dist/ and publish it as a
# downloadable artifact. Uploading to the server stays a manual step
# (see README → "Build and deploy").

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  package:
    name: Build dist/ artifact
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Add build info
        run: |
          cat > dist/BUILD_INFO.txt <<EOF
          commit: ${GITHUB_SHA}
          ref: ${GITHUB_REF_NAME}
          run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          built: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # include-hidden-files: otherwise the .htaccess files are dropped.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ steps.sha.outputs.short }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
