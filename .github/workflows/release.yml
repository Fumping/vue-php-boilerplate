name: Release artifact

# Bij elke push naar main: eerst de volledige CI, daarna dist/ bouwen en als
# downloadbaar artifact publiceren. Uploaden naar de server blijft handwerk
# (zie README → "Build & deploy").

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  package:
    name: Build dist/ artifact
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Build-info toevoegen
        run: |
          cat > dist/BUILD_INFO.txt <<EOF
          commit: ${GITHUB_SHA}
          ref: ${GITHUB_REF_NAME}
          run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          built: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # include-hidden-files: anders vallen de .htaccess-bestanden weg.
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ steps.sha.outputs.short }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
